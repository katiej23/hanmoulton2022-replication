  <style>

<body>
  <script>

    const jsPsych = initJsPsych({

    // Give each participant a unique random ID

    // This list collects all trials in order
    const timeline = [];

    const welcome_trial = {
      type: jsPsychInstructions,
      pages: [
        `<div class="instruction-text">
          <h1>Welcome, and thank you for your time!</h1>
          <p>This is a reading-based study. Please continue to complete the consent agreement and read the instructions.</p>
        </div>`
      ],
      show_clickable_nav: true,
      data: { trial_type_label: 'instructions' }
    };
    timeline.push(welcome_trial);

    const consent_trial = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `<div class="consent-text"> <h2>Consent Agreement</h2> <p> Please read this consent agreement carefully before deciding whether to participate in this experiment. </p> <p> <strong>Description:</strong> You are invited to participate in a research study about language and language learning. The purpose of the research is to understand how people learn new words. This research will be conducted through the Prolific platform, including participants from the US, UK, and Canada. If you decide to participate in this research, you will learn and use new words. </p> <p> <strong>Time Involvement:</strong> The task will last the amount of time advertised on Prolific. You are free to withdraw from the study at any time. </p> <p> <strong>Risks and Benefits:</strong> Study data will be stored securely, in compliance with Stanford University standards, minimizing the risk of confidentiality breach. This study advances our scientific understanding of how people learn new languages. We cannot and do not guarantee or promise that you will receive any benefits from this study. </p> <p> <strong>Compensation:</strong> You will receive payment in the amount advertised on Prolific. If you do not complete this study, you will receive prorated payment based on the time that you have spent. Additionally, you may be eligible for bonus payments as described in the instructions. </p> <p> <strong>Participant's Rights:</strong> If you have read this form and have decided to participate in this project, please understand your participation is voluntary and you have the right to withdraw your consent or discontinue participation at any time without penalty or loss of benefits to which you are otherwise entitled. The alternative is not to participate. You have the right to refuse to answer particular questions. The results of this research study may be presented at scientific or professional meetings or published in scientific journals. Your individual privacy will be maintained in all published and written data resulting from the study. In accordance with scientific norms, the data from this study may be used or shared with other researchers for future research (after removing personally identifying information) without additional consent from you. </p> <p> <strong>Contact Information:</strong> If you have any questions, concerns or complaints about this research, its procedures, risks and benefits, contact the Protocol Director, Robert Hawkins (<a href="mailto:rdhawkins@stanford.edu">rdhawkins@stanford.edu</a>, 217-549-6923). </p> <p> <strong>Independant Contact:</strong> If you are not satisfied with how this study is being conducted, or if you have any concerns, complaints, or general questions about the research or your rights as a participant, please contact the Stanford Institutional Review Board (IRB) to speak to someone independent of the research team at 650-723-2480 or toll free at 1-866-680-2906, or email at irbnonmed@stanford.edu. You can also write to the Stanford IRB, Stanford University, 1705 El Camino Real, Palo Alto, CA 94306. Please save or print a copy of this page for your records. </p> <p> <strong>If you agree to participate in this research, please click "I agree"</strong> </p></br> </div>`,
      choices: ['I agree', 'I do not agree'],
      data: {
          trial_type_label: 'consent'
      },
      on_finish: function(data) {
        // Record consent response
        // response is the index of the button clicked (0 = "I agree", 1 = "I do not agree")
        data.consent_response = data.response === 0 ? 'agree' : 'disagree';
        data.consent_timestamp = new Date().toISOString();
        
        // If participant does not agree, end experiment
        if (data.response === 1) { // "I do not agree" is the second button (index 1)
          jsPsych.endExperiment(`

              <h2>Thank you</h2>

        }
        }
      // button_html: function(choice, choice_index) {

      //     return `<button class="${buttonClass}">${choice}</button>`;

      //   data.consent_response = data.response === 0 ? 'agree' : 'disagree';

      timeline.push(consent_trial);

    const instructions = {
      type: jsPsychInstructions,

          <p>Please do not use Safari.</p>

          <p>Please read at a <b>natural</b> pace.</p>

            <li>Press <strong>J</strong> for <b>YES</b></li>
            <li>Press <strong>F</strong> for <b>NO</b></li>
          </ul>
        </div>`
      ],
      show_clickable_nav: true,
      data: { trial_type_label: 'instructions' }
    };
    timeline.push(instructions);

    // --- Fullscreen Trigger ---
    const enter_fullscreen = {
      type: jsPsychFullscreen,
      fullscreen_mode: true,
      message: '<p>Please click below to enter full screen.</p>',
      button_label: 'Enter Full Screen'
    };
    timeline.push(enter_fullscreen);

    function maskSentence(words, revealIndex) {
      return words.map((word, idx) => {
        if (idx === revealIndex) {
          return word;
        } else {
          return "-".repeat(word.length);
        }
      }).join(" ");
    }

    function parseChunks(text) {
      // Split on both "\\" and "-"
      return text
        .split(/\\|-/)
        .map(chunk => chunk.trim())
        .filter(chunk => chunk.length > 0);
    }

    function maskChunk(chunk) {
      // Replace every non-space character with "-"
      return chunk.replace(/[^\s]/g, "-");
    }

    function revealChunk(text, revealIndex) {
      const chunks = parseChunks(text);

      return chunks
        .map((chunk, idx) => {
          const isCurrent = (idx === revealIndex);
          
          // Split the chunk into individual words
          // This allows the browser to wrap at spaces within a long chunk
          return chunk.split(" ").map(word => {
            const content = isCurrent ? word : maskChunk(word);
            
            // Wrap each WORD in the non-breaking span
            return `<span class="spr_chunk">${content}</span>`;
          }).join(" "); // Join words with a normal space (a valid wrap point)
        })
        .join(" "); // Join chunks with a normal space (a valid wrap point)
    }

    function createReadingTrials(stimulus) {
      const trials = [];
      const sentence = stimulus.sentence;

      // --- Display fixation cross ---
      trials.push({
        type: jsPsychHtmlKeyboardResponse,
        choices: ["NO_KEYS"],
        trial_duration: 500,
        stimulus: '<span class="fixation">+</span>'
      });

      // --- Start reading on prompt ---
      trials.push({
        type: jsPsychHtmlKeyboardResponse,
        choices: [" "],
        stimulus: `<div class="instruction-text"><p>Press spacebar to begin the sentence!</p></div>`
      });

      // --- Word-by-word reading ---
      const chunks = parseChunks(sentence);
      for (let i = 0; i < chunks.length; i++) {

        if (stimulus.condition === 'upper_bound') {
          // Delay before displaying word
          trials.push({
            type: jsPsychHtmlKeyboardResponse,
            choices: ["NO_KEYS"],
            trial_duration: 50,
            stimulus: ``
          });
        }        

        const trial = {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: `<div class="spr_word"><p>${revealChunk(sentence, i)}</p></div>`,
          choices: [' '],
          data: {
            trial_type_label: 'spr_word',
            item:       stimulus.item,
            condition:  stimulus.condition,
            word:       chunks[i],
            word_index: i
          },
          on_finish: function(data) {
            data.too_fast = data.rt < 100;
            data.too_slow = data.rt > 2000;
          }
        };
        trials.push(trial);

        // var feedback_trial = {
        //   type: jsPsychHtmlKeyboardResponse,
        //   choices: ["NO_KEYS"],
        //   stimulus: `<div><p>Please try to read at a natural pace!</p></div>`,
        //   trial_duration: 4000
        // };

        // var feedback_node = {
        //   timeline: [feedback_trial],
        //   conditional_function: function() {
        //     return jsPsych.data.get().last(1).values()[0].too_slow;
        //   }
        // };
        // trials.push(feedback_node);
      }

      // --- STAGE 5: Comprehension question ---
      trials.push({
        type: jsPsychHtmlKeyboardResponse, // Swapped from ButtonResponse
        stimulus: `
          <div class="comprehension">
            <p>${stimulus.question}</p>
            <p style="font-size: 18px; margin-top: 50px; color: #555;">
              Press <strong>F</strong> for No &nbsp;&nbsp;&nbsp;&nbsp; Press <strong>J</strong> for Yes
            </p>
          </div>`,
        choices: ['j', 'f'],
        data: {
          correct_answer: stimulus.correct_answer,
          trial_type_label: 'comprehension'
        },
        on_finish: function(data) {
          // jsPsych stores the actual key pressed (e.g., "j") in data.response
          const response = (data.response === 'j') ? 'Yes' : 'No';
          data.correct = (response === data.correct_answer);
        }
      });

      return trials;
    }


    // =========================================================================
    // STAGE 4: Add fixation cross + "press spacebar" prompt
    // =========================================================================
    // Go back up to the createReadingTrials function above and add two trials
    // BEFORE the word loop:
    //
    // 1. A fixation cross (+) displayed for exactly 500ms.
    //    - Use jsPsychHtmlKeyboardResponse
    //    - Set choices: "NO_KEYS" so they can't skip it
    //    - Set trial_duration: 500 so it auto-advances
    //    - Use '<span class="fixation">+</span>' as the stimulus
    //
    // 2. A prompt saying "Press spacebar to begin the sentence."
    //    - Use jsPsychHtmlKeyboardResponse
    //    - Set choices: [' '] so only spacebar works


    // =========================================================================
    // STAGE 5: Add comprehension questions
    // =========================================================================
    // Go back to createReadingTrials and add a trial AFTER the word loop.
    //
    // Use jsPsychHtmlButtonResponse to show the comprehension question
    // with two buttons: "Yes" and "No".
    //
    // In the on_finish callback, score the response:
    //   const response = data.response === 0 ? 'Yes' : 'No';
    //   data.correct = (response === data.correct_answer);
    //
    // HINT: Store stimulus.correct_answer in the trial's `data` so
    //       on_finish can access it.
    //
    // Docs: https://www.jspsych.org/v7/plugins/html-button-response/


    // =========================================================================
    // STAGE 6: Shuffle presentation order
    // =========================================================================
    // TODO: Shuffle experimentStimuli before looping over them.
    //
    // HINT: jsPsych.randomization.shuffle(array) returns a new shuffled array.
    // Docs: https://www.jspsych.org/v7/reference/jspsych-randomization/

    // const shuffledStimuli = jsPsych.randomization.shuffle(experimentStimuli);

    // // Loop over stimuli and add to timeline
    // // (Change experimentStimuli to shuffledStimuli once you've done Stage 6)
    // for (let i = 0; i < shuffledStimuli.length; i++) {
    //   const readingTrials = createReadingTrials(shuffledStimuli[i]);
    //   timeline.push(...readingTrials);
    // }

    // 1. Separate critical items (1-20) from filler items (21+)
    //TODO: make this more robust
    const criticalStims = experimentStimuli.filter(s => s.item <= 20);
    const fillerStims = experimentStimuli.filter(s => s.item > 20);

    // 2. Pick exactly one random condition for each critical item
    const selectedCriticals = [];
    for (let i = 1; i <= 20; i++) {
      // Get all 6 variants (conditions) for this specific item number
      const itemVariants = criticalStims.filter(s => s.item === i);
      
      if (itemVariants.length > 0) {
        // Randomly pick one from the available variants
        const randomPick = jsPsych.randomization.sampleWithoutReplacement(itemVariants, 1)[0];
        selectedCriticals.push(randomPick);
      }
    }

    // 3. Combine the selected criticals with all the fillers
    const allFinalStimuli = selectedCriticals.concat(fillerStims);

    // 4. Shuffle the final list so criticals and fillers are mixed
    const shuffledStimuli = jsPsych.randomization.shuffle(allFinalStimuli);

    // 5. Loop over the final shuffled list and add to timeline
    // for (let i = 0; i < shuffledStimuli.length; i++) {
    //   const readingTrials = createReadingTrials(shuffledStimuli[i]);
    //   timeline.push(...readingTrials);
    // }
    // 5. Loop over the final shuffled list and add to timeline
    const midpoint = Math.floor(shuffledStimuli.length / 2);

    for (let i = 0; i < shuffledStimuli.length; i++) {
      
      // Check if we have reached the halfway point
      if (i === midpoint) {
        const rest_trial = {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: `
            <div class="instruction-text">
              <h2>You are halfway through the experiment!</h2>
              <p>Thank you for your time so far.</p>
              <p>Feel free to stretch and rest your eyes for a moment.</p>
              <br>
              <p>Press the <strong>SPACEBAR</strong> when you are ready to continue.</p>
            </div>`,
          choices: [' '],
          data: { trial_type_label: 'rest_break' }
        };
        timeline.push(rest_trial);
      }

      const readingTrials = createReadingTrials(shuffledStimuli[i]);
      timeline.push(...readingTrials);
    }

    // Save information from the experiment
    const subject_id = jsPsych.randomization.randomID(10);
    const filename = `${subject_id}.csv`;

    const save_data = {
      type: jsPsychPipe,
      action: "save",
      experiment_id: "Hz3czB8mbA9z",
      filename: filename,
      data_string: ()=>jsPsych.data.get().csv()
    };
    timeline.push(save_data);
  
    const completion = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: function() {
        const comp = jsPsych.data.get().filter({ trial_type_label: 'comprehension' });
        const nCorrect = comp.filter({ correct: true }).count();
        const nTotal = comp.count();
        return `<div style="max-width:600px; margin:0 auto;">
                  <h2>Thank you for your time!</h2>
                  <p>Please click the button below to complete the study and return to Prolific, or copy this completion code: <b>CAEA7YM3</b>.</p>
                  <br><br>
                  <!-- We use an <a> tag with the 'jspsych-btn' class so it looks like a button but acts like a direct link -->
                  <a href="https://app.prolific.com/submissions/complete?cc=CAEA7YM3" class="jspsych-btn" style="text-decoration: none;">
                    Return to Prolific
                  </a>
                </div>`;
      },
      choices: ["NO_KEYS"], // Disables keyboard so they are forced to click the link
      data: { trial_type_label: 'completion' }
    };
    timeline.push(completion);


    // =========================================================================
    // CHALLENGE A: Conditional timing by condition
    // =========================================================================
    // Add a 50ms delay before each word appears, but ONLY for items in the
    // "upper_bound" condition. You can do this with a conditional timeline
    // or by checking stimulus.condition inside createReadingTrials.
    //
    // Why might a researcher want to do this? (Think: degraded input,
    // time pressure manipulations, etc.)


    // =========================================================================
    // CHALLENGE B: Dynamic feedback for slow readers
    // =========================================================================
    // If the participant takes longer than 2000ms to read a word, show a
    // brief trial that says "Please try to read at a natural pace!"
    //
    // HINT: Use a conditional_function to check the previous trial's RT.
    // See: https://www.jspsych.org/v7/overview/dynamic-parameters/
    //
    // This is useful practice for any experiment where you need to give
    // participants real-time feedback based on their behavior.


    // =========================================================================
    // CHALLENGE C: Exit survey
    // =========================================================================
    // Add a survey at the end with:
    //   1. A text field asking for their native language
    //   2. A text field asking "Were there any problems with the experiment?"
    //   3. A multiple-choice question: "Did you read every word carefully?"
    //      with options: Yes / Mostly / No
    //
    // Use jsPsychSurveyText and jsPsychSurveyMultiChoice.
    // Docs: https://www.jspsych.org/v7/plugins/survey-text/
    //       https://www.jspsych.org/v7/plugins/survey-multi-choice/


    // =========================================================================
    // CHALLENGE D: Attention / bot check
    // =========================================================================
    // Design a trial that helps you distinguish real participants from:
    //   (a) someone mashing spacebar without reading
    //   (b) a language model completing the task
    //
    // Ideas:
    //   - An "instructed response" trial: "Press the letter Q now"
    //     (catches people who press spacebar on everything)
    //   - A trick question that requires actually having read a sentence
    //   - Something that's easy for humans but hard for LLMs?
    //
    // There's no single right answer — just try something and think about
    // what it would and wouldn't catch.


    // =========================================================================
    // Run the experiment!
    // =========================================================================
    jsPsych.run(timeline);

  </script>
